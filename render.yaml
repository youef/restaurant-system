services:
  - type: web
    name: restaurant-web
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @restaurant/web build
    startCommand: pnpm --filter @restaurant/web exec next start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://vevmowpemllrhscemstd.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_oElaLhaUsayMeNvuhI0iJQ_WzkCKrQ3
      - key: NEXT_PUBLIC_SITE_URL
        value: https://restaurant-web-h5t4.onrender.com
      - key: NEXT_PUBLIC_CUSTOMER_APP_URL
        value: https://restaurant-customer-nlut.onrender.com

