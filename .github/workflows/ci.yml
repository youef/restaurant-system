name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Supabase CLI
        id: supabase
        uses: supabase/setup-cli@v3
        with:
          version: 3.4.0
      - run: supabase start
      - run: supabase db lint
      - run: supabase test db
      - if: always() && steps.supabase.outcome == 'success'
        run: supabase stop

  deploy-database:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check database deployment credentials
        id: deploy-credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Supabase CLI
        if: steps.deploy-credentials.outputs.configured == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 3.4.0
      - name: Apply hosted migrations
        if: steps.deploy-credentials.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --remote --yes
      - name: Explain skipped hosted deployment
        if: steps.deploy-credentials.outputs.configured != 'true'
        run: echo "::notice::Database deployment skipped; configure SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in GitHub Actions Secrets."

  source-archive:
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source without secrets or dependencies
        run: |
          zip -qr restaurant-system.zip . \
            -x '.git/*' '*/node_modules/*' 'node_modules/*' \
               '.env' '.env.*' '*/.env' '*/.env.*' \
               '.next/*' '*/.next/*' 'coverage/*' 'test-results/*'
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-system-source
          path: restaurant-system.zip
          if-no-files-found: error
          retention-days: 14
